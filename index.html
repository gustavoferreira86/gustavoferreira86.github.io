<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Etiquetas 40x40</title>

<style>
body {
    font-family: Arial;
    display: flex;
    margin: 0;
}

/* EDITOR */
.editor {
    width: 70%;
    padding: 20px;
}

textarea {
    width: 100%;
    height: 120px;
}

/* SIDEBAR */
.sidebar {
    width: 30%;
    background: #f1f1f1;
    padding: 10px;
    overflow-y: auto;
}

.item-salvo {
    background: white;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    cursor: pointer;
    font-size: 12px;
}

.item-salvo:hover {
    background: #ddd;
}

/* ETIQUETA BASE */
.label {
    width: 40mm;
    height: 40mm;
    border: 1px solid black;
    padding: 3mm;
    box-sizing: border-box;
    background: white;
    overflow: hidden;
}

/* NOME GRANDE */
.nome-grande {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    text-align: center;
    font-size: 22pt;
    gap: 6px;
}

/* INGREDIENTES */
.ingredientes {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 8pt;
}

.ingredientes-texto {
    text-align: justify;
}

.alto-em {
    font-weight: bold;
    margin-top: 4px;
}

.alert {
    background: black;
    color: white;
    text-align: center;
    font-weight: bold;
    padding: 2px;
    font-size: 8pt;
}

/* PREVIEW */
.preview {
    margin-top: 20px;
}

/* IMPRESSÃO */
.print-area {
    display: grid;
    grid-template-columns: repeat(5, 40mm);
    gap: 5mm;
}

@media print {
    .sidebar, .controls, h2, textarea, select, label {
        display: none;
    }

    body {
        display: block;
    }
}
</style>
</head>

<body>

<div class="editor">
    <h2>Gerador de Etiquetas</h2>

    <div class="controls">

        <label>Tipo de etiqueta:</label>
        <select id="tipoEtiqueta" onchange="atualizarPreview()">
            <option value="nome">Nome grande</option>
            <option value="ingredientes">Ingredientes</option>
        </select>

        <br><br>

        <label>
            <input type="checkbox" id="autoFit" checked>
            Ajustar fonte automaticamente
        </label>

        <br>

        <label>
            <input type="checkbox" id="truncar">
            Truncar texto
        </label>

        <br><br>

        <textarea id="ingredientes" oninput="atualizarPreview()"></textarea><br>

        <button onclick="gerarEtiqueta()">Gerar para impressão</button>
        <button onclick="salvar()">Salvar</button>
        <button onclick="gerarIA()">Gerar com IA</button>
        <button onclick="window.print()">Imprimir</button>
    </div>

    <h3>Pré-visualização</h3>
    <div class="preview" id="preview"></div>

    <div class="print-area" id="printArea"></div>
</div>

<div class="sidebar">
    <h3>Salvos</h3>
    <div id="listaSalvos"></div>
</div>

<script>
// FORMATAR LINHAS
function formatarLinhas(texto) {
    let partes = texto.split(/,|\n/);
    return partes.map(p => `<div>${p.trim().toUpperCase()}</div>`).join("");
}

// CRIAR ETIQUETA
function criarEtiquetaHTML(texto) {
    const tipo = document.getElementById("tipoEtiqueta").value;

    const div = document.createElement("div");
    div.className = "label";

    if (tipo === "nome") {
        div.classList.add("nome-grande");
        div.innerHTML = formatarLinhas(texto);
    }

    if (tipo === "ingredientes") {
        div.classList.add("ingredientes");

        div.innerHTML = `
            <div class="ingredientes-texto">
                <b>Ingredientes:</b> ${texto}
            </div>

            <div class="alert">
                ALÉRGICOS: CONTÉM<br>
                DERIVADOS DO TRIGO, SOJA,<br>
                LEITE E OVOS.<br>
                Contém Glúten
            </div>

            <div class="alto-em">ALTO EM:</div>

            <div class="alert">
                GORDURA SATURADA
            </div>
        `;
    }

    return div;
}

// AJUSTE FONTE
function ajustarFonte(el) {
    let size = 22;
    const min = 8;

    el.style.fontSize = size + "pt";

    while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > min) {
        size--;
        el.style.fontSize = size + "pt";
    }
}

// TRUNCAR
function truncarTexto(el) {
    let texto = el.innerText;

    while (el.scrollHeight > el.clientHeight) {
        texto = texto.slice(0, -1);
        el.innerText = texto + "...";
    }
}

// APLICAR AJUSTES
function aplicarAjustes(el) {
    const autoFit = document.getElementById("autoFit").checked;
    const truncar = document.getElementById("truncar").checked;

    if (el.classList.contains("ingredientes")) {
        const texto = el.querySelector(".ingredientes-texto");

        if (autoFit) ajustarFonte(texto);
        else if (truncar) truncarTexto(texto);
    } else {
        if (autoFit) ajustarFonte(el);
        else if (truncar) truncarTexto(el);
    }
}

// PREVIEW
function atualizarPreview() {
    const texto = document.getElementById("ingredientes").value;
    const preview = document.getElementById("preview");

    preview.innerHTML = "";

    const etiqueta = criarEtiquetaHTML(texto);
    preview.appendChild(etiqueta);

    aplicarAjustes(etiqueta);
}

// GERAR IMPRESSÃO
function gerarEtiqueta() {
    const texto = document.getElementById("ingredientes").value;
    const area = document.getElementById("printArea");

    area.innerHTML = "";

    for (let i = 0; i < 20; i++) {
        const etiqueta = criarEtiquetaHTML(texto);
        area.appendChild(etiqueta);
        aplicarAjustes(etiqueta);
    }
}

// SALVAR
function salvar() {
    let lista = JSON.parse(localStorage.getItem("etiquetas")) || [];

    lista.push(document.getElementById("ingredientes").value);

    localStorage.setItem("etiquetas", JSON.stringify(lista));

    carregarLista();
}

// LISTA
function carregarLista() {
    let lista = JSON.parse(localStorage.getItem("etiquetas")) || [];

    const div = document.getElementById("listaSalvos");
    div.innerHTML = "";

    lista.forEach((item, i) => {
        const el = document.createElement("div");
        el.className = "item-salvo";

        el.innerHTML = `
            ${item.substring(0, 60)}...
            <br>
            <button onclick="event.stopPropagation(); excluir(${i})">Excluir</button>
        `;

        el.onclick = () => {
            document.getElementById("ingredientes").value = item;
            atualizarPreview();
        };

        div.appendChild(el);
    });
}

// EXCLUIR
function excluir(i) {
    let lista = JSON.parse(localStorage.getItem("etiquetas")) || [];
    lista.splice(i, 1);
    localStorage.setItem("etiquetas", JSON.stringify(lista));
    carregarLista();
}

// IA SIMULADA
function gerarIA() {
    const produto = prompt("Nome do produto:");

    if (!produto) return;

    document.getElementById("ingredientes").value =
        "Açúcar, farinha de trigo enriquecida, leite, ovos, gordura vegetal, fermento químico";

    atualizarPreview();
}

// INIT
carregarLista();
atualizarPreview();
</script>

</body>
</html>
