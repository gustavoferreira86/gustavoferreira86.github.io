<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Etiquetas 40x40</title>

<style>
body {
    font-family: Arial;
    display: flex;
    margin: 0;
    background: #f6f8fb;
}

.editor { flex: 1; padding: 30px; }
.sidebar { width: 300px; background: white; border-left: 1px solid #ddd; padding: 20px; }

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

/* INPUTS */
textarea, input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

/* BOTÕES */
button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-right: 5px;
}

.btn { background: #6366f1; color: white; }

/* ETIQUETA */
.label {
    width: 40mm;
    height: 40mm;
    background: white;
    border: 1px solid #ccc;
    padding: 3mm;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* TEXTO */
.nome {
    font-weight: bold;
    text-align: center;
    justify-content: center;
    display: flex;
    flex-direction: column;
    height: 100%;
}

/* COMPLETA */
.completa {
    font-size: 8pt;
    justify-content: space-between;
}

.titulo {
    font-weight: bold;
    text-align: center;
}

.alert {
    background: black;
    color: white;
    text-align: center;
    font-weight: bold;
    padding: 2px;
}

/* GRID */
.print {
    display: grid;
    grid-template-columns: repeat(5, 40mm);
    gap: 5mm;
}

/* PREVIEW */
.preview {
    display: flex;
}

/* SALVOS */
.item {
    border: 1px solid #ddd;
    padding: 8px;
    margin-bottom: 8px;
    cursor: pointer;
}

@media print {
    .editor, .sidebar { display: none; }
}
</style>
</head>

<body>

<div class="editor">

    <div class="card">

        <label>Tipo</label>
        <select id="tipo" onchange="update()">
            <option value="texto">Texto simples</option>
            <option value="completa">Etiqueta completa</option>
        </select>

        <div id="grupoTexto">
            <label>Texto</label>
            <textarea id="texto" oninput="update()"></textarea>
        </div>

        <div id="grupoCompleta">
            <label>Título</label>
            <input id="titulo" oninput="update()">

            <label>Ingredientes</label>
            <textarea id="ingredientes" oninput="update()"></textarea>
        </div>

        <button class="btn" onclick="gerar()">Gerar</button>
        <button class="btn" onclick="salvar()">Salvar</button>
        <button class="btn" onclick="window.print()">Imprimir</button>

    </div>

    <div class="card">
        <h3>Preview</h3>
        <div id="preview" class="preview"></div>
    </div>

    <div id="print" class="print"></div>

</div>

<div class="sidebar">
    <h3>Salvos</h3>
    <div id="lista"></div>
</div>

<script>

function criarEtiqueta() {
    const tipo = document.getElementById("tipo").value;

    const div = document.createElement("div");
    div.className = "label";

    if (tipo === "texto") {
        div.classList.add("nome");

        const texto = document.getElementById("texto").value;

        div.innerHTML = texto
            .split(/,|\n/)
            .map(t => `<div>${t.toUpperCase()}</div>`)
            .join("");
    }

    if (tipo === "completa") {
        div.classList.add("completa");

        const titulo = document.getElementById("titulo").value;
        const ingredientes = document.getElementById("ingredientes").value;

        div.innerHTML = `
            <div class="titulo">${titulo}</div>

            <div>
                <b>Ingredientes:</b> ${ingredientes}
            </div>

            <div class="alert">
                ALÉRGICOS: CONTÉM DERIVADOS DO TRIGO, SOJA, LEITE E OVOS.<br>
                Contém Glúten
            </div>

            <div class="alert">
                ALTO EM: GORDURA SATURADA
            </div>
        `;
    }

    ajustarFonte(div);

    return div;
}

function ajustarFonte(el) {
    let size = 14;
    el.style.fontSize = size + "pt";

    while ((el.scrollHeight > el.clientHeight) && size > 6) {
        size--;
        el.style.fontSize = size + "pt";
    }
}

function update() {
    const preview = document.getElementById("preview");
    preview.innerHTML = "";
    preview.appendChild(criarEtiqueta());

    // alternar campos
    const tipo = document.getElementById("tipo").value;
    document.getElementById("grupoTexto").style.display = tipo === "texto" ? "block" : "none";
    document.getElementById("grupoCompleta").style.display = tipo === "completa" ? "block" : "none";
}

function gerar() {
    const area = document.getElementById("print");
    area.innerHTML = "";

    for (let i = 0; i < 20; i++) {
        area.appendChild(criarEtiqueta());
    }
}

function salvar() {
    let lista = JSON.parse(localStorage.getItem("etiquetas")) || [];

    lista.push({
        tipo: document.getElementById("tipo").value,
        texto: document.getElementById("texto").value,
        titulo: document.getElementById("titulo").value,
        ingredientes: document.getElementById("ingredientes").value
    });

    localStorage.setItem("etiquetas", JSON.stringify(lista));
    carregar();
}

function carregar() {
    let lista = JSON.parse(localStorage.getItem("etiquetas")) || [];
    const div = document.getElementById("lista");
    div.innerHTML = "";

    lista.forEach((item, i) => {
        const el = document.createElement("div");
        el.className = "item";

        el.innerText = item.texto || item.titulo;

        el.onclick = () => {
            document.getElementById("tipo").value = item.tipo;
            document.getElementById("texto").value = item.texto;
            document.getElementById("titulo").value = item.titulo;
            document.getElementById("ingredientes").value = item.ingredientes;
            update();
        };

        div.appendChild(el);
    });
}

update();
carregar();

</script>

</body>
</html>
