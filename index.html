<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Etiquetas - Versão Final</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; margin: 0; background: #f0f2f5; height: 100vh; color: #333; }
        
        .editor { flex: 1; padding: 25px; overflow-y: auto; }
        .sidebar { width: 320px; background: white; border-left: 1px solid #ddd; padding: 20px; overflow-y: auto; }

        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2, h3 { margin-top: 0; color: #1a1a1a; }

        label { display: block; font-size: 13px; font-weight: bold; margin: 10px 0 4px; color: #666; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 10px; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-print { background: #111; color: white; width: 100%; margin-top: 20px; }

        /* Estilo da Etiqueta */
        .label {
            width: 40mm; height: 40mm; border: 1px solid #000; padding: 3mm;
            box-sizing: border-box; display: flex; flex-direction: column;
            background: white; overflow: hidden; position: relative;
        }

        .nome { text-align: center; font-weight: bold; justify-content: center; text-transform: uppercase; }
        
        /* Layout Bolo: Cima, Meio, Baixo */
        .layout-bolo {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Espalha Topo, Centro e Base */
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }

        .completa { font-size: 8pt; justify-content: space-between; }
        .alert { background: black; color: white; text-align: center; font-weight: bold; padding: 2px; font-size: 7pt; margin-top: 2px; }

        .print-area { display: grid; grid-template-columns: repeat(5, 40mm); gap: 5mm; margin-top: 20px; }

        .item-salvo { background: #f9f9f9; padding: 12px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; cursor: pointer; position: relative; }
        .item-salvo:hover { border-color: #6366f1; background: #f5f7ff; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 2px 8px; border-radius: 4px; position: absolute; right: 8px; top: 8px; cursor: pointer; }

        @media print {
            .editor, .sidebar { display: none !important; }
            body { background: white; }
            .label { border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div class="editor">
    <h2>🏷️ Gerador de Etiquetas</h2>
    
    <div class="card">
        <label>Tipo de Etiqueta</label>
        <select id="tipo" onchange="update()">
            <option value="texto">Texto Grande</option>
            <option value="completa">Completa (Ingredientes)</option>
            <option value="bolo">Montagem de Bolo</option>
        </select>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Fonte (pt)</label>
                <input type="number" id="fonte" value="14" oninput="update()">
            </div>
            <div style="flex: 1; align-self: flex-end; padding-bottom: 15px;">
                <label><input type="checkbox" id="truncar" onchange="update()"> Truncar Inteligente</label>
            </div>
        </div>

        <div id="grupoTexto">
            <label>Texto</label>
            <textarea id="texto" placeholder="Ex: BOLO DE POTE, CHOCOLATE" oninput="update()"></textarea>
        </div>

        <div id="grupoCompleta" style="display:none">
            <label>Título</label>
            <input id="titulo" placeholder="Nome do Produto" oninput="update()">
            <label>Ingredientes</label>
            <textarea id="ingredientes" placeholder="Lista de ingredientes..." oninput="update()"></textarea>
        </div>

        <div id="grupoBolo" style="display:none">
            <label>Massa (Topo)</label>
            <select id="massa" onchange="update()">
                <option>BOLO BRANCO</option>
                <option>BOLO DE CHOCOLATE</option>
                <option>BOLO MESCLADO</option>
                <option>BOLO RED VELVET</option>
            </select>
            <label>Recheio 1 (Meio)</label>
            <select id="recheio1" onchange="update()"></select>
            <label>Recheio 2 (Baixo)</label>
            <select id="recheio2" onchange="update()"></select>
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="salvar()">💾 Salvar Etiqueta</button>
            <button class="btn btn-primary" onclick="gerarGrade()">🔄 Gerar Grade (20)</button>
        </div>
        <button class="btn btn-print" onclick="imprimir()">🖨️ Imprimir Etiquetas</button>
    </div>

    <div class="card">
        <h3>Preview</h3>
        <div id="preview"></div>
    </div>
    <div id="printArea" class="print-area"></div>
</div>

<aside class="sidebar">
    <h3>📂 Minhas Etiquetas</h3>
    <div id="listaSalvos"></div>
</aside>

<script>
const recheios = ["(VAZIO)", "LEITE CONDENSADO","LEITE CONDENSADO COM COCO","BRIGADEIRO","MOUSSE DE MARACUJÁ","MOUSSE DE MORANGO","CREME DE NINHO","DOCE DE LEITE COM NOZES"];

function carregarRecheios() {
    const r1 = document.getElementById("recheio1");
    const r2 = document.getElementById("recheio2");
    recheios.forEach(r => {
        r1.innerHTML += `<option>${r}</option>`;
        r2.innerHTML += `<option>${r}</option>`;
    });
}

function aplicarAbreviacoes(texto) {
    return texto.toUpperCase()
        .replace(/LEITE CONDENSADO/g, "LEITE COND.")
        .replace(/LEITE COND\./g, "L. COND.")
        .replace(/CONDENSADO/g, "COND.")
        .replace(/MARACUJÁ/g, "MARAC.")
        .replace(/MORANGO/g, "MORANG.")
        .replace(/CHOCOLATE/g, "CHOC.");
}

function criarEtiquetaHTML() {
    const tipo = document.getElementById("tipo").value;
    const fonte = document.getElementById("fonte").value;
    const truncar = document.getElementById("truncar").checked;

    const div = document.createElement("div");
    div.className = "label";
    div.style.fontSize = fonte + "pt";

    if (tipo === "texto") {
        div.classList.add("nome");
        let txt = document.getElementById("texto").value;
        div.innerHTML = txt.split(/\n|,/).map(t => `<div>${t.trim().toUpperCase()}</div>`).join("");
    } 
    else if (tipo === "completa") {
        div.classList.add("completa");
        div.innerHTML = `
            <div><b>${document.getElementById("titulo").value.toUpperCase()}</b></div>
            <div style="flex-grow:1; margin: 4px 0;">${document.getElementById("ingredientes").value}</div>
            <div class="alert">ALÉRGICOS: CONTÉM DERIVADOS DO TRIGO, SOJA, LEITE E OVOS.<br>CONTÉM GLÚTEN</div>
            <div class="alert">ALTO EM: GORDURA SATURADA</div>`;
    } 
    else if (tipo === "bolo") {
        const m = document.getElementById("massa").value;
        const r1 = document.getElementById("recheio1").value;
        const r2 = document.getElementById("recheio2").value;
        
        div.innerHTML = `
            <div class="layout-bolo">
                <div class="topo">${m}</div>
                <div class="meio" style="font-size:0.9em">${r1 !== '(VAZIO)' ? r1 : ''}</div>
                <div class="baixo" style="font-size:0.9em">${r2 !== '(VAZIO)' ? r2 : ''}</div>
            </div>`;
    }

    if (truncar) {
        setTimeout(() => {
            // Tenta abreviar antes de cortar
            if (div.scrollHeight > div.clientHeight) {
                const elementos = div.querySelectorAll('div');
                elementos.forEach(el => {
                    if (el.innerText.includes("LEITE CONDENSADO")) {
                        el.innerText = el.innerText.replace("LEITE CONDENSADO", "LEITE COND.");
                    }
                });
            }
            // Se ainda não couber, abrevia mais
            if (div.scrollHeight > div.clientHeight) {
                const elementos = div.querySelectorAll('div');
                elementos.forEach(el => el.innerText = aplicarAbreviacoes(el.innerText));
            }
            // Se ainda assim não couber, remove palavras (truncar clássico)
            while (div.scrollHeight > div.clientHeight) {
                let conteudo = div.innerText.trim().split(/\s+/);
                if (conteudo.length <= 1) break;
                conteudo.pop();
                div.innerText = conteudo.join(" ") + "...";
            }
        }, 0);
    } else {
        setTimeout(() => ajustarFonte(div), 0);
    }

    return div;
}

function ajustarFonte(el) {
    let size = parseInt(el.style.fontSize);
    while (el.scrollHeight > el.clientHeight && size > 7) {
        size--;
        el.style.fontSize = size + "pt";
    }
}

function update() {
    const tipo = document.getElementById("tipo").value;
    document.getElementById("grupoTexto").style.display = tipo === "texto" ? "block" : "none";
    document.getElementById("grupoCompleta").style.display = tipo === "completa" ? "block" : "none";
    document.getElementById("grupoBolo").style.display = tipo === "bolo" ? "block" : "none";

    const preview = document.getElementById("preview");
    preview.innerHTML = "";
    preview.appendChild(criarEtiquetaHTML());
}

function salvar() {
    const nomeSalvo = prompt("Digite um nome para identificar esta etiqueta:", "Minha Etiqueta");
    if (!nomeSalvo) return;

    let lista = JSON.parse(localStorage.getItem("minhasEtiquetas")) || [];
    const item = {
        id: Date.now(),
        identificador: nomeSalvo,
        tipo: document.getElementById("tipo").value,
        texto: document.getElementById("texto").value,
        titulo: document.getElementById("titulo").value,
        ingredientes: document.getElementById("ingredientes").value,
        massa: document.getElementById("massa").value,
        r1: document.getElementById("recheio1").value,
        r2: document.getElementById("recheio2").value
    };
    lista.push(item);
    localStorage.setItem("minhasEtiquetas", JSON.stringify(lista));
    carregarLista();
}

function carregarLista() {
    const lista = JSON.parse(localStorage.getItem("minhasEtiquetas")) || [];
    const div = document.getElementById("listaSalvos");
    div.innerHTML = "";
    lista.forEach(item => {
        const el = document.createElement("div");
        el.className = "item-salvo";
        el.innerHTML = `<strong>${item.identificador}</strong><button class="btn-del" onclick="excluir(${item.id}, event)">×</button>`;
        el.onclick = () => restaurar(item);
        div.appendChild(el);
    });
}

function restaurar(item) {
    document.getElementById("tipo").value = item.tipo;
    document.getElementById("texto").value = item.texto;
    document.getElementById("titulo").value = item.titulo;
    document.getElementById("ingredientes").value = item.ingredientes;
    document.getElementById("massa").value = item.massa;
    document.getElementById("recheio1").value = item.r1;
    document.getElementById("recheio2").value = item.r2;
    update();
}

function excluir(id, event) {
    event.stopPropagation();
    let lista = JSON.parse(localStorage.getItem("minhasEtiquetas")) || [];
    lista = lista.filter(i => i.id !== id);
    localStorage.setItem("minhasEtiquetas", JSON.stringify(lista));
    carregarLista();
}

function gerarGrade() {
    const area = document.getElementById("printArea");
    area.innerHTML = "";
    for (let i = 0; i < 20; i++) { area.appendChild(criarEtiquetaHTML()); }
}

function imprimir() {
    const qtd = prompt("Quantas etiquetas?", "20");
    if (!qtd) return;
    const area = document.getElementById("printArea");
    area.innerHTML = "";
    for (let i = 0; i < qtd; i++) { area.appendChild(criarEtiquetaHTML()); }
    setTimeout(() => window.print(), 300);
}

carregarRecheios();
carregarLista();
update();
</script>
</body>
</html>
