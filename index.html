<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador de Etiquetas</title>

<style>
body { font-family: Arial; display: flex; margin: 0; background: #f6f8fb; }
.editor { flex: 1; padding: 30px; }
.sidebar { width: 320px; background: white; border-left: 1px solid #ddd; padding: 20px; }

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

textarea, input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    margin: 2px;
    font-size: 12px;
}

.btn { background: #6366f1; color: white; }
.btn-green { background: #10b981; color: white; }

.label {
    width: 40mm;
    height: 40mm;
    background: white;
    border: 1px solid #ccc;
    padding: 3mm;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.nome {
    font-weight: bold;
    text-align: center;
    justify-content: center;
    display: flex;
    flex-direction: column;
}

.completa {
    font-size: 8pt;
    justify-content: space-between;
}

.alert {
    background: black;
    color: white;
    text-align: center;
    font-weight: bold;
    padding: 2px;
}

.print {
    display: grid;
    grid-template-columns: repeat(5, 40mm);
    gap: 5mm;
}

@media print {
    .editor, .sidebar { display: none; }
}
</style>
</head>

<body>

<div class="editor">

<div class="card">

<input type="hidden" id="editId">

<label>Tipo</label>
<select id="tipo" onchange="update()">
    <option value="texto">Texto</option>
    <option value="completa">Completa</option>
    <option value="bolo">Bolo</option>
</select>

<label>Fonte (pt)</label>
<input type="number" id="fonte" value="14" oninput="update()">

<label><input type="checkbox" id="truncar" onchange="update()"> Truncar texto</label>

<!-- TEXTO -->
<div id="grupoTexto">
    <textarea id="texto" oninput="update()"></textarea>
</div>

<!-- COMPLETA -->
<div id="grupoCompleta">
    <input id="titulo" placeholder="Título" oninput="update()">
    <textarea id="ingredientes" placeholder="Ingredientes" oninput="update()"></textarea>
</div>

<!-- BOLO -->
<div id="grupoBolo">
    <select id="massa" onchange="update()">
        <option>BOLO BRANCO</option>
        <option>BOLO DE CHOCOLATE</option>
        <option>BOLO MESCLADO</option>
    </select>

    <select id="recheio1" onchange="update()"></select>
    <select id="recheio2" onchange="update()"></select>
</div>

<input id="nomeSalvar" placeholder="Nome">

<button class="btn" onclick="gerar()">Gerar</button>
<button class="btn-green" onclick="salvar()">Salvar</button>
<button class="btn" onclick="imprimir()">Imprimir</button>

</div>

<div class="card">
<h3>Preview</h3>
<div id="preview"></div>
</div>

<div id="print" class="print"></div>

</div>

<div class="sidebar">
<h3>Salvos</h3>
<div id="lista"></div>
</div>

<script>

const recheios = [
"LEITE CONDENSADO","LEITE CONDENSADO COM COCO","LEITE CONDENSADO COM ABACAXI",
"LEITE CONDENSADO COM MORANGO","LEITE CONDENSADO COM PESSEGO","LEITE CONDENSADO COM AMEIXA",
"BRIGADEIRO","CREME","MOUSSE CHOCOLATE","MOUSSE DE LEITE NINHO",
"MOUSSE DE MORANGO","MOUSSE DE MARACUJÁ","MOUSSE DE 4 LEITES",
"LEITE CONDENSADO COM ABACAXI E COCO","FLORESTA NEGRA"
];

function carregarRecheios() {
    recheios.forEach(r => {
        recheio1.innerHTML += `<option>${r}</option>`;
        recheio2.innerHTML += `<option>${r}</option>`;
    });
}

function criarEtiqueta() {
    const tipo = tipoEl.value;
    const div = document.createElement("div");
    div.className = "label";

    let fonteSize = fonte.value;
    div.style.fontSize = fonteSize + "pt";

    if (tipo === "texto") {
        div.classList.add("nome");
        div.innerHTML = texto.value.toUpperCase().split(/\n|,/).map(t=>`<div>${t}</div>`).join("");
    }

    if (tipo === "completa") {
        div.classList.add("completa");
        div.innerHTML = `
        <div><b>${titulo.value}</b></div>
        <div>${ingredientes.value}</div>
        <div class="alert">ALÉRGICOS: CONTÉM DERIVADOS DO TRIGO, SOJA, LEITE E OVOS.<br>CONTÉM GLÚTEN</div>
        <div class="alert">ALTO EM: GORDURA SATURADA</div>`;
    }

    if (tipo === "bolo") {
        div.classList.add("nome");

        div.innerHTML = `
        <div>${massa.value.toUpperCase()}</div>
        <div>${recheio1.value.toUpperCase()}</div>
        <div>${recheio2.value.toUpperCase()}</div>`;
    }

    ajustar(div);

    return div;
}

function ajustar(el){
    if(truncar.checked){
        el.style.overflow="hidden";
    } else {
        let size = fonte.value;
        while(el.scrollHeight > el.clientHeight && size > 6){
            size--;
            el.style.fontSize = size + "pt";
        }
    }
}

function update(){
    preview.innerHTML="";
    preview.appendChild(criarEtiqueta());

    grupoTexto.style.display = tipo.value==="texto"?"block":"none";
    grupoCompleta.style.display = tipo.value==="completa"?"block":"none";
    grupoBolo.style.display = tipo.value==="bolo"?"block":"none";
}

function gerar(){
    print.innerHTML="";
    for(let i=0;i<20;i++) print.appendChild(criarEtiqueta());
}

function imprimir(){
    const qtd = prompt("Quantidade?",20);
    if(!qtd) return;
    print.innerHTML="";
    for(let i=0;i<qtd;i++) print.appendChild(criarEtiqueta());
    setTimeout(()=>window.print(),200);
}

function salvar(){
    let lista = JSON.parse(localStorage.getItem("etiquetas")||"[]");
    lista.push({
        nome:nomeSalvar.value,
        tipo:tipo.value,
        texto:texto.value,
        titulo:titulo.value,
        ingredientes:ingredientes.value
    });
    localStorage.setItem("etiquetas",JSON.stringify(lista));
    carregar();
}

function carregar(){
    let lista = JSON.parse(localStorage.getItem("etiquetas")||"[]");
    listaDiv.innerHTML="";
    lista.forEach(i=>{
        listaDiv.innerHTML+=`<div class="item"><b>${i.nome}</b></div>`;
    });
}

carregarRecheios();
update();
carregar();

</script>

</body>
</html>
