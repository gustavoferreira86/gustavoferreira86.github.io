<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador de Etiquetas</title>

<style>
body {
    font-family: Arial;
    display: flex;
    margin: 0;
    background: #f5f5f5;
}

.editor { flex: 1; padding: 20px; }
.sidebar { width: 300px; background: white; border-left: 1px solid #ddd; padding: 15px; }

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

input, textarea, select {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.btn { background: #6366f1; color: white; }

.label {
    width: 40mm;
    height: 40mm;
    border: 1px solid #000;
    padding: 3mm;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.nome {
    text-align: center;
    font-weight: bold;
    justify-content: center;
}

.completa {
    font-size: 8pt;
    justify-content: space-between;
}

.alert {
    background: black;
    color: white;
    text-align: center;
    font-weight: bold;
    padding: 2px;
}

.print {
    display: grid;
    grid-template-columns: repeat(5, 40mm);
    gap: 5mm;
}

@media print {
    .editor, .sidebar { display: none; }
}
</style>

</head>
<body>

<div class="editor">

<div class="card">

<label>Tipo</label>
<select id="tipo" onchange="update()">
    <option value="texto">Texto</option>
    <option value="completa">Completa</option>
    <option value="bolo">Bolo</option>
</select>

<label>Tamanho da fonte (pt)</label>
<input type="number" id="fonte" value="14" oninput="update()">

<label><input type="checkbox" id="truncar" onchange="update()"> Truncar texto</label>

<!-- TEXTO -->
<div id="grupoTexto">
<textarea id="texto" placeholder="Digite o texto" oninput="update()"></textarea>
</div>

<!-- COMPLETA -->
<div id="grupoCompleta">
<input id="titulo" placeholder="Título" oninput="update()">
<textarea id="ingredientes" placeholder="Ingredientes" oninput="update()"></textarea>
</div>

<!-- BOLO -->
<div id="grupoBolo">
<select id="massa" onchange="update()">
<option>BOLO BRANCO</option>
<option>BOLO DE CHOCOLATE</option>
<option>BOLO MESCLADO</option>
</select>

<select id="recheio1" onchange="update()"></select>
<select id="recheio2" onchange="update()"></select>
</div>

<input id="nomeSalvar" placeholder="Nome para salvar">

<button class="btn" onclick="gerar()">Gerar</button>
<button class="btn" onclick="salvar()">Salvar</button>
<button class="btn" onclick="imprimir()">Imprimir</button>

</div>

<div class="card">
<h3>Preview</h3>
<div id="preview"></div>
</div>

<div id="print" class="print"></div>

</div>

<div class="sidebar">
<h3>Salvos</h3>
<div id="lista"></div>
</div>

<script>

// RECHEIOS
const recheios = [
"LEITE CONDENSADO","LEITE CONDENSADO COM COCO","LEITE CONDENSADO COM ABACAXI",
"LEITE CONDENSADO COM MORANGO","LEITE CONDENSADO COM PESSEGO","LEITE CONDENSADO COM AMEIXA",
"BRIGADEIRO","CREME","MOUSSE CHOCOLATE","MOUSSE DE LEITE NINHO",
"MOUSSE DE MORANGO","MOUSSE DE MARACUJÁ","MOUSSE DE 4 LEITES",
"LEITE CONDENSADO COM ABACAXI E COCO","FLORESTA NEGRA"
];

function carregarRecheios() {
    const r1 = document.getElementById("recheio1");
    const r2 = document.getElementById("recheio2");

    recheios.forEach(r => {
        r1.innerHTML += `<option>${r}</option>`;
        r2.innerHTML += `<option>${r}</option>`;
    });
}

// CRIAR ETIQUETA
function criarEtiqueta() {

    const tipo = document.getElementById("tipo").value;
    const fonte = document.getElementById("fonte").value;
    const truncar = document.getElementById("truncar").checked;

    const div = document.createElement("div");
    div.className = "label";
    div.style.fontSize = fonte + "pt";

    if (tipo === "texto") {
        div.classList.add("nome");

        const texto = document.getElementById("texto").value.toUpperCase();

        div.innerHTML = texto
            .split(/\n|,/)
            .map(t => `<div>${t}</div>`)
            .join("");
    }

    if (tipo === "completa") {
        div.classList.add("completa");

        div.innerHTML = `
        <div><b>${document.getElementById("titulo").value}</b></div>
        <div>${document.getElementById("ingredientes").value}</div>
        <div class="alert">ALÉRGICOS: CONTÉM DERIVADOS DO TRIGO, SOJA, LEITE E OVOS.<br>CONTÉM GLÚTEN</div>
        <div class="alert">ALTO EM: GORDURA SATURADA</div>`;
    }

    if (tipo === "bolo") {
        div.classList.add("nome");

        div.innerHTML = `
        <div>${document.getElementById("massa").value}</div>
        <div>${document.getElementById("recheio1").value}</div>
        <div>${document.getElementById("recheio2").value}</div>`;
    }

    if (!truncar) {
        ajustarFonte(div);
    }

    return div;
}

// AUTO AJUSTE
function ajustarFonte(el) {
    let size = parseInt(el.style.fontSize);
    while (el.scrollHeight > el.clientHeight && size > 6) {
        size--;
        el.style.fontSize = size + "pt";
    }
}

// UPDATE
function update() {
    const tipo = document.getElementById("tipo").value;

    document.getElementById("grupoTexto").style.display = tipo === "texto" ? "block" : "none";
    document.getElementById("grupoCompleta").style.display = tipo === "completa" ? "block" : "none";
    document.getElementById("grupoBolo").style.display = tipo === "bolo" ? "block" : "none";

    const preview = document.getElementById("preview");
    preview.innerHTML = "";
    preview.appendChild(criarEtiqueta());
}

// GERAR
function gerar() {
    const area = document.getElementById("print");
    area.innerHTML = "";

    for (let i = 0; i < 20; i++) {
        area.appendChild(criarEtiqueta());
    }
}

// IMPRIMIR
function imprimir() {
    const qtd = prompt("Quantas etiquetas?", "20");
    if (!qtd) return;

    const area = document.getElementById("print");
    area.innerHTML = "";

    for (let i = 0; i < qtd; i++) {
        area.appendChild(criarEtiqueta());
    }

    setTimeout(() => window.print(), 200);
}

// SALVAR
function salvar() {
    let lista = JSON.parse(localStorage.getItem("etiquetas")) || [];

    lista.push({
        nome: document.getElementById("nomeSalvar").value,
        tipo: document.getElementById("tipo").value,
        texto: document.getElementById("texto").value
    });

    localStorage.setItem("etiquetas", JSON.stringify(lista));
    carregar();
}

// LISTA
function carregar() {
    const lista = JSON.parse(localStorage.getItem("etiquetas")) || [];
    const div = document.getElementById("lista");

    div.innerHTML = "";

    lista.forEach(item => {
        div.innerHTML += `<div class="item"><b>${item.nome}</b></div>`;
    });
}

// INIT
carregarRecheios();
update();
carregar();

</script>

</body>
</html>
